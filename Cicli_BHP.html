h+='<span style="color:#f5b942">Sintesi (verde tetto, ambra centro, rosso pavimento)</span></div><div style="margin-top:6px;color:#a3adba;font-size:12px">';F.lista.forEach(f=>{h+=f.nome+': '+f.aff+'<br>'});document.getElementById('tip').innerHTML=h+'</div>'}
function draw(){const s=document.getElementById('s');if(!lv){s.innerHTML='';return}if(lv==='fattori'){drawF();return}
document.getElementById('tip').textContent='Tocca il grafico per leggere prezzo e scenario.';
const sc=D.scenari[lv],maxg=sc[sc.length-1].giorni,nb=Math.min(D.serie.length,Math.max(60,maxg*1.2|0)),ser=D.serie.slice(-nb);
const t0=new Date(ser[0][0]).getTime(),t1=last.getTime()+maxg*864e5;let lo=Infinity,hi=-Infinity;
ser.forEach(p=>{lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1])});sc.forEach(p=>{lo=Math.min(lo,p.p10);hi=Math.max(hi,p.p90)});
const pad=(hi-lo)*.05;lo-=pad;hi+=pad;const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b),T=g=>X(last.getTime()+g*864e5);
let o=grid(lo,hi,X,Y)+'<polyline fill="none" stroke="#eef1f5" stroke-width="1.6" points="'+ser.map(p=>X(new Date(p[0]).getTime())+','+Y(p[1])).join(' ')+'"/>';
const pts=[{g:0,c:D.prezzo,a:D.prezzo,b:D.prezzo,d:D.prezzo,e:D.prezzo}].concat(sc.map(p=>({g:p.giorni,c:p.centrale,a:p.p25,b:p.p75,d:p.p10,e:p.p90})));
const poly=(u,l)=>pts.map(p=>T(p.g)+','+Y(p[u])).join(' ')+' '+pts.slice().reverse().map(p=>T(p.g)+','+Y(p[l])).join(' ');
o+=`<polygon points="${poly('e','d')}" fill="#f5b942" opacity=".15"/><polygon points="${poly('b','a')}" fill="#f5b942" opacity=".3"/>`;
o+=`<polyline fill="none" stroke="#f5b942" stroke-width="2.2" stroke-dasharray="6 4" points="${pts.map(p=>T(p.g)+','+Y(p.c)).join(' ')}"/>`;
let lx=-99;pts.forEach((p,i)=>{o+=`<circle cx="${T(p.g)}" cy="${Y(p.c)}" r="3.5" fill="#f5b942"/>`;if(i&&T(p.g)-lx>52){lx=T(p.g);const dt=new Date(last.getTime()+p.g*864e5).toISOString().slice(5,10).split('-').reverse().join('/');o+=`<text x="${T(p.g)}" y="${Y(p.b)-4}" fill="#3ddc97" font-size="8.5" text-anchor="middle">${fm(p.b)}</text><text x="${T(p.g)}" y="${Y(p.a)+10}" fill="#ff5c6c" font-size="8.5" text-anchor="middle">${fm(p.a)}</text><text x="${T(p.g)+5}" y="${Y(p.c)-5}" fill="#f5b942" font-size="8.5">${fm(p.c)}</text><text x="${T(p.g)}" y="${H-m.b+12}" fill="#a3adba" font-size="8" text-anchor="middle">${dt}</text>`}});
const FN=D.finestre&&D.finestre[lv];if(FN&&!FN.superata){const t0f=new Date(FN.da).getTime(),t1f=new Date(FN.a).getTime(),xa=X(t0f),xb=X(t1f);if(xb>m.l&&xa<W-m.r){const xs=Math.max(m.l,xa),xe=Math.min(W-m.r,xb);o+=`<rect x="${xs}" y="${m.t}" width="${xe-xs}" height="${H-m.t-m.b}" fill="#3ddc97" opacity=".13"/><text x="${xs>W-190?xe-2:xs+2}" text-anchor="${xs>W-190?'end':'start'}" y="${m.t+11}" fill="#3ddc97" font-size="9">minimo atteso ${FN.da.slice(8)}/${FN.da.slice(5,7)} - ${FN.a.slice(8)}/${FN.a.slice(5,7)}</text>`}}
if(FN&&FN.inv&&!FN.inv.superata){const t0f=new Date(FN.inv.da).getTime(),t1f=new Date(FN.inv.a).getTime(),xa=X(t0f),xb=X(t1f);if(xb>m.l&&xa<W-m.r){const xs=Math.max(m.l,xa),xe=Math.min(W-m.r,xb);o+=`<rect x="${xs}" y="${m.t}" width="${xe-xs}" height="${H-m.t-m.b}" fill="#ff5c6c" opacity=".11"/><text x="${xs>W-190?xe-2:xs+2}" text-anchor="${xs>W-190?'end':'start'}" y="${m.t+23}" fill="#ff5c6c" font-size="9">massimo atteso ${FN.inv.da.slice(8)}/${FN.inv.da.slice(5,7)} - ${FN.inv.a.slice(8)}/${FN.inv.a.slice(5,7)}</text>`}}
o+=`<line id="cur" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="#a3adba" opacity="0"/>`;s.innerHTML=o;
s.onpointerdown=s.onpointermove=ev=>{const r=s.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,t=t0+(x-m.l)/(W-m.l-m.r)*(t1-t0),dt=new Date(t);
const c=document.getElementById('cur');c.setAttribute('x1',x);c.setAttribute('x2',x);c.setAttribute('opacity',.8);
let txt=dt.toISOString().slice(0,10);if(t<=last.getTime()){let b=ser[0];ser.forEach(p=>{if(Math.abs(new Date(p[0])-dt)<Math.abs(new Date(b[0])-dt))b=p});txt+=' - prezzo '+b[1].toFixed(2)}
else{const g=(t-last.getTime())/864e5;let b=sc[0];sc.forEach(p=>{if(Math.abs(p.giorni-g)<Math.abs(b.giorni-g))b=p});
txt='Tra ~'+b.giorni+' giorni: centro '+b.centrale.toFixed(2)+' | pavimento (25%) '+b.p25.toFixed(2)+' | tetto (75%) '+b.p75.toFixed(2)+' | minimo prob. (10%) '+b.p10.toFixed(2)+' | massimo prob. (90%) '+b.p90.toFixed(2)+' | cicli osservati: '+b.n_cicli+' | saliva nel '+Math.round(b.pct_pos*100)+'% dei casi (normale '+Math.round(b.base_pct_pos*100)+'%)'}
document.getElementById('tip').textContent=txt}}
mk();draw();
</script></body></html>
